<!DOCTYPE html>
<!-- DOCTYPE: говорим браузеру, что это современная страница HTML5 -->
<html lang="ru">
<!-- Корневой элемент всей страницы. lang="ru" подсказывает браузеру, что текст русский -->
<head>
    <!-- Внутри head лежит служебная информация: она не показывается на экране -->
    <meta charset="UTF-8">
    <!-- Кодировка UTF-8 нужна, чтобы русские буквы отображались без «крокозябр» -->
    <title>Рулетка</title>
    <!-- Это название вкладки браузера -->
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем внешний файл стилей: вся «одежда» страницы описана в style.css -->
</head>
<body>
    <!-- Всё, что находится внутри body, пользователь видит в окне браузера -->

    <!-- ===== БЛОК РУЛЕТКИ =====
         Важный момент: в HTML рулетка стоит ДО подарка (<header>).
         Браузер выводит элементы сверху вниз, значит рулетка окажется НАД подарком.
         Изначально рулетка скрыта через visibility: hidden в CSS.
         Место под неё уже зарезервировано, поэтому подарок не прыгает вниз, когда рулетка появляется. -->
    <main class="Header_roulette" id="rouletteSection">
        <!-- main — главное содержимое страницы; id нужен, чтобы JavaScript нашёл этот блок -->

        <!-- Окно рулетки: благодаря overflow: hidden из CSS видна только часть ленты -->
        <div class="roulette_window" id="Peso">
            <!-- id="Peso" используем в JS, чтобы узнать ширину окна -->

            <!-- Лента с карточками. Сейчас она пустая: карточки создаст JavaScript -->
            <div id="roulette_bar" class="roulette_bar"></div>

            <!-- Неподвижный жёлтый указатель по центру окна (поверх ленты) -->
            <div class="roulette_point"></div>
        </div>

        <!-- Кнопка запуска прокрутки. type="button" явно говорит: это не кнопка отправки формы -->
        <button id="Spin_Button" type="button">Make a Wish</button>
        <!-- Кнопка отмены: закрывает результат и возвращает ленту в исходное положение -->
        <button id="Cancel_Button" type="button">Cancel</button>

        <!-- <dialog> — встроенное браузерное модальное окно: оно перекрывает страницу -->
        <dialog id="drop_dialog" class="Drop">
            <!-- Сюда JavaScript положит картинку и текст с результатом -->
            <div class="Drop_Item" id="result"></div>
        </dialog>
    </main>

    <!-- ===== ПОДАРОК =====
         Он идёт ПОСЛЕ рулетки, поэтому визуально находится под ней. -->
    <header>
        <!-- ===== ЗАДНИЙ ФОН: ДВЕ ЁЛКИ, НАРИСОВАННЫЕ В SVG =====
             SVG — векторная графика: картинка состоит из фигур (многоугольников, линий, кругов),
             а не из пикселей. Поэтому ёлки остаются чёткими при любом масштабе.
             В CSS у SVG стоит z-index: 0, а у подарка z-index: 1 — значит подарок лежит ПЕРЕД ёлками,
             то есть прямо под их ветвями. -->
        <svg class="forest" viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <!-- viewBox задаёт внутреннюю систему координат: (0, 0) — левый верхний угол,
                 (800, 360) — правый нижний. Все фигуры рисуем в этих координатах.
                 aria-hidden="true" скрывает декорацию от программ чтения с экрана. -->

            <defs>
                <!-- defs — «склад» того, что мы будем использовать повторно.
                     Здесь лежит одна ёлка, а ниже мы её дважды вызовем через <use>. -->

                <linearGradient id="treeGradient" x1="0" y1="0" x2="1" y2="1">
                    <!-- Градиент — плавный переход цвета. Здесь: от светло-зелёного к тёмному. -->
                    <stop offset="0%" stop-color="#2f7d4f" />
                    <!-- stop задаёт цвет на определённом месте градиента (0% — начало). -->
                    <stop offset="100%" stop-color="#12452c" />
                    <!-- 100% — конец градиента. -->
                </linearGradient>

                <g id="fir">
                    <!-- g объединяет фигуры в одну группу с именем "fir" (ёлка).
                         Центр ствола находится в точке (0, 0), поэтому потом группу удобно сдвигать. -->

                    <ellipse cx="0" cy="300" rx="115" ry="12" fill="#ffffff" opacity="0.75" />
                    <!-- Небольшой сугроб под ёлкой. opacity="0.75" делает его полупрозрачным. -->

                    <rect x="-14" y="230" width="28" height="70" rx="4" fill="#6b3f2a" />
                    <!-- Ствол: прямоугольник шириной 28 и высотой 70; rx скругляет углы. -->

                    <polygon points="0,120 -105,265 105,265" fill="url(#treeGradient)" />
                    <!-- Нижний ярус: три точки — вершина и два нижних угла.
                         fill="url(#treeGradient)" закрашивает его нашим градиентом. -->

                    <polygon points="0,65 -85,215 85,215" fill="url(#treeGradient)" />
                    <!-- Средний ярус: уже и выше. Рисуется поверх нижнего. -->

                    <polygon points="0,10 -62,155 62,155" fill="url(#treeGradient)" />
                    <!-- Верхний ярус: самый маленький, рисуется последним — поэтому сверху. -->

                    <polygon points="0,120 -34,172 0,158 34,172" fill="#ffffff" opacity="0.85" />
                    <!-- Снег на нижнем ярусе: белый многоугольник поверх зелёного. -->

                    <polygon points="0,65 -27,113 0,101 27,113" fill="#ffffff" opacity="0.85" />
                    <!-- Снег на среднем ярусе. -->

                    <polygon points="0,10 -18,50 0,41 18,50" fill="#ffffff" opacity="0.9" />
                    <!-- Снег на верхнем ярусе. -->

                    <circle cx="0" cy="5" r="5" fill="#fff3a6" />
                    <!-- Маленькая светящаяся точка на макушке — как звезда. -->
                </g>
            </defs>

            <!-- use берёт готовую ёлку из defs и рисует её в нужном месте.
                 transform="translate(300, 0)" сдвигает ёлку вправо на 300 и вниз на 0. -->
            <use href="#fir" transform="translate(300, 0)" />

            <!-- Вторая ёлка чуть ниже и меньше: scale(0.92) уменьшает её до 92% размера.
                 transform выполняется справа налево: сначала scale, потом translate. -->
            <use href="#fir" transform="translate(500, 20) scale(0.92)" />
        </svg>

        <!-- Подарок лежит внизу между ёлками. Его анимации падения и тряски заданы в CSS. -->
        <div class="gift-wrap">
            <!-- Обёртка-контейнер: размер задаём у самой картинки, а анимации — через transform -->
            <img src="GIFT_Case.png"
                 class="Case"
                 id="Case_Js"
                 alt="Подарок, который падает, трясётся и открывает рулетку">
            <!-- id="Case_Js" нужен JavaScript, чтобы отследить окончание падения и клик -->
        </div>
    </header>

    <!-- Пустой подвал оставлен «на будущее»: здесь потом можно добавить текст или ссылки -->
    <footer></footer>

    <!-- Подключаем JavaScript. defer = выполнить скрипт после того, как HTML разобран,
         иначе document.getElementById мог бы не найти ещё несуществующие элементы -->
    <script src="scrypt.js" defer></script>
</body>
</html>
