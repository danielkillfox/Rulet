<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>Рулетка</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <img src="GIFT_Case.png" class="Case" id="Case_Js">
        </header>

        <main class="Header_roulette">
            
            <!-- Окно рулетки -->
            <div class="roulette_window"  id="Peso">
                <div id="roulette_bar" class="roulette_bar"></div>
                <div class="roulette_point"></div>
            </div>

            <!-- Кнопки под окном, а не внутри -->
            <button id="Spin_Button">Make a Wish</button>
            <button id="Cancel_Button">Cancel</button>

            <!-- Окно с результатом -->
            <dialog id="drop_dialog" class="Drop">
                <div class="Drop_Item" id="result"></div>
            </dialog>

        </main>
        <footer></footer>

        <script src="scrypt.js" defer></script>
    </body>
</html>
