<!DOCTYPE html>
<!-- DOCTYPE: говорим браузеру, что это современная страница HTML5 -->
<html lang="ru">
<!-- Корневой элемент всей страницы. lang="ru" подсказывает браузеру, что текст русский -->
<head>
    <!-- Внутри head лежит служебная информация: она не показывается на экране -->
    <meta charset="UTF-8">
    <!-- Кодировка UTF-8 нужна, чтобы русские буквы отображались без «крокозябр» -->
    <title>Рулетка</title>
    <!-- Это название вкладки браузера -->
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем внешний файл стилей: вся «одежда» страницы описана в style.css -->
</head>
<body>
    <!-- Всё, что находится внутри body, пользователь видит в окне браузера -->

    <!-- ===== БЛОК РУЛЕТКИ ===== -->
    <main class="Header_roulette" id="rouletteSection">
        <!-- main — главное содержимое страницы; id нужен, чтобы JavaScript нашёл этот блок -->

        <!-- Окно рулетки: благодаря overflow: hidden из CSS видна только часть ленты -->
        <div class="roulette_window" id="Peso">
            <!-- id="Peso" используем в JS, чтобы узнать ширину окна -->

            <!-- Лента с карточками. Сейчас она пустая: карточки создаст JavaScript -->
            <div id="roulette_bar" class="roulette_bar"></div>

            <!-- Неподвижный жёлтый указатель по центру окна (поверх ленты) -->
            <div class="roulette_point"></div>
        </div>

        <!-- Кнопка запуска прокрутки. type="button" явно говорит: это не кнопка отправки формы -->
        <button id="Spin_Button" type="button">Make a Wish</button>
        <!-- Кнопка отмены: закрывает результат и возвращает ленту в исходное положение -->
        <button id="Cancel_Button" type="button">Cancel</button>

        <!-- <dialog> — встроенное браузерное модальное окно: оно перекрывает страницу -->
        <dialog id="drop_dialog" class="Drop">
            <!-- Сюда JavaScript положит картинку и текст с результатом -->
            <div class="Drop_Item" id="result"></div>
        </dialog>
    </main>

    <!-- ===== СЦЕНА: ЁЛКА И ПОДАРОК ===== -->
    <header>
        <!-- SVG-фон с ёлкой и снегом. Вся графика векторная. -->
        <svg class="forest" viewBox="0 0 400 360" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
                <linearGradient id="treeGradient" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#2f7d4f" />
                    <stop offset="100%" stop-color="#12452c" />
                </linearGradient>
            </defs>

            <!-- Звёзды ночного неба -->
            <g fill="#ffffff">
                <circle cx="30" cy="25" r="1.6" opacity="0.9" />
                <circle cx="70" cy="55" r="1.2" opacity="0.7" />
                <circle cx="110" cy="20" r="1.8" opacity="0.95" />
                <circle cx="150" cy="45" r="1.3" opacity="0.8" />
                <circle cx="190" cy="18" r="1.5" opacity="0.9" />
                <circle cx="230" cy="40" r="1.1" opacity="0.75" />
                <circle cx="270" cy="22" r="1.7" opacity="0.9" />
                <circle cx="310" cy="50" r="1.4" opacity="0.8" />
                <circle cx="350" cy="28" r="1.6" opacity="0.9" />
                <circle cx="50" cy="90" r="1.2" opacity="0.6" />
                <circle cx="330" cy="85" r="1.3" opacity="0.65" />
            </g>

            <!-- Луна -->
            <circle cx="330" cy="60" r="18" fill="#f5f3ce" opacity="0.9" />

            <!-- Снежная земля под ёлкой -->
            <rect x="0" y="300" width="400" height="60" fill="#ffffff" />
            <ellipse cx="200" cy="300" rx="200" ry="24" fill="#f2f8ff" />

            <!-- Ёлка по центру -->
            <g transform="translate(200, 0)">
                <ellipse cx="0" cy="300" rx="115" ry="12" fill="#ffffff" opacity="0.9" />

                <rect x="-14" y="230" width="28" height="70" rx="4" fill="#6b3f2a" />

                <polygon points="0,120 -105,265 105,265" fill="url(#treeGradient)" />
                <polygon points="0,65 -85,215 85,215" fill="url(#treeGradient)" />
                <polygon points="0,10 -62,155 62,155" fill="url(#treeGradient)" />

                <polygon points="0,120 -34,172 0,158 34,172" fill="#ffffff" opacity="0.85" />
                <polygon points="0,65 -27,113 0,101 27,113" fill="#ffffff" opacity="0.85" />
                <polygon points="0,10 -18,50 0,41 18,50" fill="#ffffff" opacity="0.9" />

                <circle cx="0" cy="5" r="5" fill="#fff3a6" />
            </g>
        </svg>

        <!-- Подарки под ёлкой: несколько разных, чтобы не был один -->
        <div class="gifts">
            <!-- Дополнительный подарок слева -->
            <svg class="gift-static" viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect x="10" y="42" width="100" height="50" rx="6" fill="#2980b9" stroke="#1f618d" stroke-width="2" />
                <rect x="10" y="42" width="100" height="12" fill="#f7dc6f" />
                <rect x="54" y="30" width="12" height="62" fill="#f7dc6f" />
                <path d="M60 30 C42 12, 32 30, 60 30 C88 30, 78 12, 60 30" fill="#f7dc6f" stroke="#d4ac0d" stroke-width="2" />
            </svg>

            <!-- Главный интерактивный подарок (падает и открывается) -->
            <div class="Case" id="Case_Js" role="img" aria-label="Подарок">
                <svg viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">
                    <rect x="10" y="42" width="100" height="50" rx="6" fill="#c0392b" stroke="#7b241c" stroke-width="2" />
                    <rect x="10" y="42" width="100" height="12" fill="#f1c40f" />
                    <rect x="54" y="30" width="12" height="62" fill="#f1c40f" />
                    <path d="M60 30 C42 12, 32 30, 60 30 C88 30, 78 12, 60 30" fill="#f1c40f" stroke="#d4ac0d" stroke-width="2" />
                </svg>
            </div>

            <!-- Дополнительный подарок справа -->
            <svg class="gift-static" viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect x="10" y="42" width="100" height="50" rx="6" fill="#27ae60" stroke="#1e8449" stroke-width="2" />
                <rect x="10" y="42" width="100" height="12" fill="#f9e79f" />
                <rect x="54" y="30" width="12" height="62" fill="#f9e79f" />
                <path d="M60 30 C42 12, 32 30, 60 30 C88 30, 78 12, 60 30" fill="#f9e79f" stroke="#d4ac0d" stroke-width="2" />
            </svg>

            <!-- Ещё один подарок -->
            <svg class="gift-static" viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect x="10" y="42" width="100" height="50" rx="6" fill="#8e44ad" stroke="#6c3483" stroke-width="2" />
                <rect x="10" y="42" width="100" height="12" fill="#f5cba7" />
                <rect x="54" y="30" width="12" height="62" fill="#f5cba7" />
                <path d="M60 30 C42 12, 32 30, 60 30 C88 30, 78 12, 60 30" fill="#f5cba7" stroke="#d4ac0d" stroke-width="2" />
            </svg>
        </div>
    </header>

    <!-- Пустой подвал оставлен «на будущее»: здесь потом можно добавить текст или ссылки -->
    <footer></footer>

    <!-- Подключаем JavaScript. defer = выполнить скрипт после того, как HTML разобран,
         иначе document.getElementById мог бы не найти ещё несуществующие элементы -->
    <script src="scrypt.js" defer></script>
</body>
</html>
